<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的股票紀錄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="股票紀錄">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230F172A'/%3E%3Cpolyline points='30 120 70 80 100 110 150 55' fill='none' stroke='%2393C5FD' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230F172A'/%3E%3Cpolyline points='30 120 70 80 100 110 150 55' fill='none' stroke='%2393C5FD' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--up:#C62828;--down:#2E7D32;--ink:#111827;--ink2:#374151;--muted:#4B5563;--line:#E5E7EB;--bg:#F4F6F8;--blue:#1D4ED8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:#0F172A;color:#F8FAFC;padding-top:env(safe-area-inset-top)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
main{padding:20px 0 calc(48px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.card .k{font-size:13px;color:var(--muted)} .card .v{font-size:22px;font-weight:700} .card .s{font-size:13px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pad{padding:16px}
h2{margin:0 0 12px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
input,select{min-height:44px;padding:0 10px;border:1px solid #D1D5DB;border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:#fff;width:100%}
.w-s{width:96px}.w-m{width:120px}.w-l{width:150px}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:8px}
.btn{border:0;background:var(--blue);color:#fff;font-weight:600;padding:0 18px}
.btn2{border:1px solid #D1D5DB;background:#fff;color:var(--ink2);font-weight:600;padding:0 14px}
.seg{display:flex;border:1px solid #D1D5DB;border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:0 16px;font-weight:600;background:#fff;color:var(--ink2)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;padding:0 14px;font-weight:600;background:transparent;color:var(--ink2)}
.tabs button[aria-selected=true]{background:#E0E7FF;color:#1E3A8A}
.pill{border:1px solid #D1D5DB;border-radius:999px;padding:0 14px;background:#fff;color:var(--ink2)}
.pill[aria-pressed=true]{background:#111827;color:#fff;border-color:#111827}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid #D1D5DB;border-radius:999px;padding:0 14px 0 8px;background:#fff;color:var(--ink2);font-weight:600}
.switch .t{width:34px;height:20px;border-radius:999px;background:#9CA3AF;display:inline-flex;padding:2px}
.switch .t i{width:16px;height:16px;border-radius:50%;background:#fff}
.switch[aria-pressed=true]{background:#EFF6FF;color:#1E3A8A;border-color:#93C5FD}
.switch[aria-pressed=true] .t{background:var(--blue);justify-content:flex-end}
.note{padding:10px 16px;background:#EFF6FF;border-bottom:1px solid #DBEAFE;color:#1E3A8A;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:#F9FAFB;color:var(--muted);font-size:13px;font-weight:500;padding:10px 12px;text-align:right;white-space:nowrap}
td{padding:12px;border-top:1px solid #F1F5F9;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}
.l{text-align:left}.c{text-align:center}.b{font-weight:600}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.buy{background:#FDECEC;color:#B91C1C}.sell{background:#E8F3EA;color:#1B5E20}
.edit td{padding:6px 4px}.edit td input,.edit td select{min-width:80px}
.incomplete{background:#FFFBEB}
.del{width:44px;border:0;background:transparent;color:#6B7280;display:inline-flex;align-items:center;justify-content:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}
figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:10px}
figcaption{font-size:16px;font-weight:700}
.fh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.lg{display:flex;gap:14px;font-size:13px;color:var(--muted)} .lg span{display:inline-flex;align-items:center;gap:6px} .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.plrow{display:grid;grid-template-columns:minmax(90px,130px) 1fr 1fr 90px;align-items:center;min-height:36px;border-radius:6px}
.plrow:hover,.plrow:focus{background:#EFF6FF;outline:none}
.plrow .n{font-size:14px;padding-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plrow .neg{display:flex;justify-content:flex-end}.plrow .pos{display:flex;border-left:1px solid #9CA3AF}
.plrow .v{font-size:14px;font-weight:600;text-align:right;padding-right:6px}
.wrow{display:grid;grid-template-columns:minmax(90px,130px) 1fr 60px;gap:10px;align-items:center}
.months{display:flex;gap:12px;min-height:230px}
.mcol{flex:0 0 68px;display:flex;flex-direction:column;align-items:center;font-size:13px}
.mcol .h{height:90px;width:100%;display:flex;justify-content:center}
.foot{font-size:13px;color:var(--muted);margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.err{color:#B91C1C;font-weight:600}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
</style>
</head>
<body>
<header><div class="wrap hdr">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>我的股票紀錄</div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px">
    <span style="color:#CBD5E1">加權指數</span><span id="taiex" style="font-weight:600;font-size:16px">—</span><span id="taiexChg" style="font-size:13px"></span>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<datalist id="brokers"><option value="國泰證券"><option value="國泰證券定期定額"><option value="永豐金證券"></datalist>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(function(){
const KEY='my-stock-record-v2',OLDKEY='my-stock-record-v1';
const INITIAL={nextId:1,prices:{},trades:[]};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){data=null}
if(!data||!Array.isArray(data.trades)){data=JSON.parse(JSON.stringify(INITIAL));
  try{const old=JSON.parse(localStorage.getItem(OLDKEY));if(old&&!old.sample&&Array.isArray(old.trades)){old.trades.forEach(t=>{t.id=data.nextId++;data.trades.push(t)});Object.assign(data.prices,old.prices||{})}}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const ui={tab:'holdings',filter:'all',edit:false,error:'',form:{side:'buy',date:today(),code:'',name:'',qty:'',price:''}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}

const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const fee=(q,p)=>Math.max(20,Math.round(q*p*0.001425));
const tax=(q,p,s)=>s==='sell'?Math.round(q*p*0.003):0;
const fmt=(n,d)=>Number(n).toLocaleString('zh-TW',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const signed=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const pct=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'%';
const tone=n=>n>0?'var(--up)':n<0?'var(--down)':'var(--ink2)';
const valid=t=>!!t.date&&!!String(t.code).trim()&&num(t.qty)>0&&num(t.price)>0;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trash='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

function compute(){
  const pos={},monthly={};let realized=0;
  data.trades.filter(valid).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(t=>{
    const q0=num(t.qty),pr=num(t.price),code=String(t.code).trim();
    const p=pos[code]||(pos[code]={code,name:t.name||code,qty:0,cost:0,realized:0,invested:0});
    const f=fee(q0,pr);
    if(t.side==='buy'){p.qty+=q0;p.cost+=q0*pr+f;p.invested+=q0*pr+f}
    else{const avg=p.qty?p.cost/p.qty:0,q=Math.min(q0,p.qty);
      const given=t.profit!==undefined&&t.profit!==''&&isFinite(Number(t.profit));
      const r=given?Number(t.profit):(q===q0?q0*pr-f-tax(q0,pr,'sell')-avg*q:0);
      if(!given&&q<q0)p.unknown=true;
      realized+=r;p.realized+=r;const m=t.date.slice(0,7);monthly[m]=(monthly[m]||0)+r;p.cost-=avg*q;p.qty-=q}
  });
  let value=0,cost=0;
  const all=Object.values(pos).map(p=>{const raw=data.prices[p.code],price=num(raw);
    const known=raw!==undefined&&raw!==''&&price>0;
    const v=p.qty>0&&known?p.qty*price:0, un=p.qty>0&&known?v-p.cost:0;
    if(p.qty>0){value+=v;cost+=p.cost}
    return Object.assign({},p,{price,known,value:v,un,total:p.realized+un})});
  return {all,holdings:all.filter(p=>p.qty>0),value,cost,unreal:value-cost,realized,monthly};
}

function summaryHTML(c){
  return `<section class="cards" aria-label="資產總覽">
  <div class="card"><span class="k">總市值</span><span class="v">NT$ ${fmt(c.value)}</span><span class="s">持有 ${c.holdings.length} 檔</span></div>
  <div class="card"><span class="k">投入成本（含手續費）</span><span class="v">NT$ ${fmt(c.cost)}</span><span class="s">平均成本法計算</span></div>
  <div class="card"><span class="k">未實現損益</span><span class="v" style="color:${tone(c.unreal)}">${signed(c.unreal)}</span><span class="s b" style="color:${tone(c.unreal)}">${c.cost?pct(c.unreal/c.cost*100):'—'}</span></div>
  <div class="card"><span class="k">已實現損益</span><span class="v" style="color:${tone(c.realized)}">${signed(c.realized)}</span><span class="s">已扣手續費與證交稅</span></div>
  </section>`;
}

function formHTML(){
  const f=ui.form,ok=num(f.qty)>0&&num(f.price)>0,b=f.side==='buy';
  return `<section class="panel pad" aria-labelledby="addt"><h2 id="addt">新增一筆交易</h2>
  <div class="row">
   <div><div style="font-size:13px;color:var(--ink2);margin-bottom:4px">買賣</div><div class="seg">
    <button type="button" data-act="side" data-v="buy" aria-pressed="${b}" style="${b?'background:var(--up);color:#fff':''}">買進</button>
    <button type="button" data-act="side" data-v="sell" aria-pressed="${!b}" style="${!b?'background:var(--down);color:#fff':''}">賣出</button></div></div>
   <label>日期<input type="date" data-f="date" value="${esc(f.date)}" class="w-l"></label>
   <label>股票代號<input type="text" inputmode="numeric" data-f="code" placeholder="2330" value="${esc(f.code)}" class="w-s"></label>
   <label>名稱<input type="text" data-f="name" placeholder="台積電" value="${esc(f.name)}" class="w-m"></label>
   <label>股數<input type="number" inputmode="numeric" min="1" data-f="qty" placeholder="1000" value="${esc(f.qty)}" class="w-m"></label>
   <label>成交價<input type="number" inputmode="decimal" min="0" step="0.05" data-f="price" placeholder="1000" value="${esc(f.price)}" class="w-m"></label>
   <label>券商<input type="text" data-f="broker" list="brokers" placeholder="國泰證券" value="${esc(f.broker||'')}" class="w-l"></label>
   <button type="button" class="btn" data-act="add">加入紀錄</button>
  </div>
  <div class="row" style="margin-top:10px;font-size:13px;color:var(--muted);gap:16px" id="preview">
   <span>預估金額 NT$ ${ok?fmt(num(f.qty)*num(f.price)):'—'}</span><span>手續費 NT$ ${ok?fmt(fee(num(f.qty),num(f.price))):'—'}</span><span>證交稅 NT$ ${ok?(b?'0':fmt(tax(num(f.qty),num(f.price),'sell'))):'—'}</span>
   ${ui.error?`<span role="alert" class="err">${esc(ui.error)}</span>`:''}
  </div></section>`;
}

function holdingsHTML(c){
  if(!c.holdings.length)return '<p class="empty">目前沒有持股，從上方新增第一筆買進紀錄。</p>';
  return `<div class="scroll"><table><thead><tr><th class="l">股票</th><th>持有股數</th><th>平均成本</th><th>現價</th><th>市值</th><th>未實現損益</th><th>報酬率</th></tr></thead><tbody>
  ${c.holdings.map(h=>`<tr><td><span class="b">${esc(h.code)}</span> <span style="color:var(--ink2)">${esc(h.name)}</span></td>
   <td>${fmt(h.qty)}</td><td>${fmt(h.cost/h.qty,2)}</td>
   <td>${ui.edit?`<input type="number" inputmode="decimal" step="0.05" aria-label="${esc(h.name)} 現價" data-price="${esc(h.code)}" value="${esc(data.prices[h.code]??'')}" style="width:110px;text-align:right;border-color:#93C5FD">`:(h.known?fmt(h.price,2):'[輸入現價]')}</td>
   <td>${h.known?fmt(h.value):'—'}</td><td class="b" style="color:${tone(h.un)}">${h.known?signed(h.un):'—'}</td><td class="b" style="color:${tone(h.un)}">${h.known?pct(h.un/h.cost*100):'—'}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function tradesHTML(){
  const order=ui.edit?(a,b)=>b.id-a.id:(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;
  const list=data.trades.filter(t=>ui.edit||valid(t)).filter(t=>ui.filter==='all'||t.side===ui.filter).sort(order);
  if(!list.length)return `<p class="empty">${ui.edit?'還沒有紀錄，按「新增一列」開始記帳。':'這個篩選條件下沒有紀錄。'}</p>`;
  const net=t=>{const q=num(t.qty),p=num(t.price),f=fee(q,p),x=tax(q,p,t.side);return t.side==='buy'?-(q*p+f):q*p-f-x};
  if(!ui.edit){
    return `<div class="scroll"><table style="min-width:1000px"><thead><tr><th class="l">日期</th><th class="l">股票</th><th class="c">買賣</th><th>股數</th><th>成交價</th><th>手續費</th><th>證交稅</th><th>淨收付</th><th>利潤</th><th class="l">券商</th><th><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">操作</span></th></tr></thead><tbody>
    ${list.map(t=>{const q=num(t.qty),p=num(t.price),x=tax(q,p,t.side);return `<tr><td style="color:var(--ink2)">${esc(t.date)}</td><td class="l"><span class="b">${esc(t.code)}</span> <span style="color:var(--ink2)">${esc(t.name)}</span></td>
     <td class="c"><span class="tag ${t.side}">${t.side==='buy'?'買進':'賣出'}</span></td><td>${fmt(q)}</td><td>${fmt(p,2)}</td><td style="color:var(--ink2)">${fmt(fee(q,p))}</td><td style="color:var(--ink2)">${x?fmt(x):'—'}</td><td class="b">${signed(net(t))}</td>
     <td class="b" style="color:${t.profit!==undefined&&t.profit!==''?tone(num(t.profit)):'var(--ink2)'}">${t.profit!==undefined&&t.profit!==''?signed(num(t.profit)):'—'}</td>
     <td class="l" style="color:var(--ink2)">${esc(t.broker||'')}</td>
     <td style="padding:4px 12px"><button type="button" class="del" data-act="del" data-id="${t.id}" aria-label="刪除 ${esc(t.date)} ${esc(t.name)} 的紀錄">${trash}</button></td></tr>`}).join('')}
    </tbody></table></div>`;
  }
  return `<div class="scroll"><table class="edit" style="min-width:1180px"><thead><tr><th class="l">日期</th><th class="l">代號</th><th class="l">名稱</th><th class="l">買賣</th><th>股數</th><th>成交價</th><th>利潤（賣出）</th><th class="l">券商</th><th>淨收付（含費稅）</th><th><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">操作</span></th></tr></thead><tbody>
  ${list.map(t=>{const ok=valid(t);return `<tr class="${ok?'':'incomplete'}" data-row="${t.id}">
   <td><input type="date" aria-label="日期" data-e="date" value="${esc(t.date)}" style="min-width:140px"></td>
   <td><input type="text" inputmode="numeric" aria-label="代號" data-e="code" placeholder="2330" value="${esc(t.code)}" style="width:90px;font-weight:600"></td>
   <td><input type="text" aria-label="名稱" data-e="name" placeholder="台積電" value="${esc(t.name)}" style="min-width:120px"></td>
   <td><select aria-label="買賣" data-e="side" class="${t.side}" style="width:90px;font-weight:600"><option value="buy"${t.side==='buy'?' selected':''}>買進</option><option value="sell"${t.side==='sell'?' selected':''}>賣出</option></select></td>
   <td><input type="number" inputmode="numeric" aria-label="股數" data-e="qty" placeholder="1000" value="${esc(t.qty)}" style="width:110px;text-align:right"></td>
   <td><input type="number" inputmode="decimal" step="0.05" aria-label="成交價" data-e="price" placeholder="0.00" value="${esc(t.price)}" style="width:110px;text-align:right"></td>
   <td><input type="number" inputmode="decimal" aria-label="利潤" data-e="profit" placeholder="${t.side==='sell'?'自動計算':'—'}" value="${esc(t.profit??'')}" style="width:110px;text-align:right"></td>
   <td><input type="text" aria-label="券商" data-e="broker" placeholder="券商" value="${esc(t.broker||'')}" list="brokers" style="min-width:130px"></td>
   <td class="b" data-net style="color:${ok?'var(--ink)':'#6B7280'}">${ok?signed(net(t)):'未填完'}</td>
   <td><button type="button" class="del" data-act="del" data-id="${t.id}" aria-label="刪除這一列">${trash}</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}

function analysisHTML(c){
  const per=c.all.slice().sort((a,b)=>b.total-a.total);
  if(!per.length)return '<p class="empty">還沒有可分析的交易。</p>';
  const tot=c.realized+c.unreal,inv=per.reduce((a,x)=>a+x.invested,0),win=per.filter(x=>x.total>0).length;
  const best=per[0],worst=per[per.length-1],maxA=Math.max(1,...per.map(x=>Math.abs(x.total)));
  const open=per.filter(x=>x.qty>0&&x.value>0).sort((a,b)=>b.value-a.value),maxV=Math.max(1,...open.map(x=>x.value));
  const months=Object.keys(c.monthly).sort(),maxM=Math.max(1,...months.map(m=>Math.abs(c.monthly[m])));
  const tile=(k,v,s,col)=>`<div class="card"><span class="k">${k}</span><span class="v" style="font-size:19px${col?';color:'+col:''}">${v}</span><span class="s b"${col?` style="color:${col}"`:''}>${s}</span></div>`;
  return `<div class="pad" style="display:flex;flex-direction:column;gap:16px;background:#FCFCFB">
  <div class="cards">
   ${tile('總損益（已實現＋未實現）',signed(tot),'總投入報酬率 '+(inv?pct(tot/inv*100):'—'),tone(tot))}
   ${tile('獲利檔數',win+' / '+per.length,'勝率 '+Math.round(win/per.length*100)+'%')}
   <div class="card"><span class="k">表現最佳</span><span class="v" style="font-size:17px">${esc(best.code+' '+best.name)}</span><span class="s b" style="color:${tone(best.total)}">${signed(best.total)}</span></div>
   <div class="card"><span class="k">表現最差</span><span class="v" style="font-size:17px">${esc(worst.code+' '+worst.name)}</span><span class="s b" style="color:${tone(worst.total)}">${signed(worst.total)}</span></div>
  </div>
  <div class="grid2">
   <figure><div class="fh"><figcaption>各股總損益</figcaption><div class="lg"><span><i class="sw" style="background:var(--up)"></i>獲利</span><span><i class="sw" style="background:var(--down)"></i>虧損</span></div></div>
    <div>${per.map(x=>{const w=(Math.abs(x.total)/maxA*100).toFixed(1)+'%';const d=`未實現 ${signed(x.un)}　已實現 ${signed(x.realized)}${x.invested?'　報酬率 '+pct(x.total/x.invested*100):''}${x.qty>0?'':'（已出清）'}`;
     return `<div class="plrow" tabindex="0" data-detail="${esc(x.code+' '+x.name+'：'+d)}" aria-label="${esc(x.code+' '+x.name)} 總損益 ${signed(x.total)}，${esc(d)}">
      <span class="n">${esc(x.code+' '+x.name)}</span><span class="neg"><span style="height:18px;width:${x.total<0?w:'0'};background:var(--down);border-radius:4px 0 0 4px"></span></span>
      <span class="pos"><span style="height:18px;width:${x.total>0?w:'0'};background:var(--up);border-radius:0 4px 4px 0"></span></span><span class="v">${signed(x.total)}</span></div>`}).join('')}</div>
    <p class="foot" id="pldetail" style="min-height:20px">點一下或把滑鼠移到長條上看未實現／已實現明細</p></figure>
   <figure><div class="fh"><figcaption>持股比重（依市值）</figcaption><span class="foot">${open.length&&c.value?'最大持股占 '+(open[0].value/c.value*100).toFixed(1)+'%':''}</span></div>
    ${open.length?`<div style="display:flex;flex-direction:column;gap:10px">${open.map(x=>`<div class="wrow"><span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.code+' '+x.name)}</span>
     <span><span style="display:block;height:18px;width:${(x.value/maxV*100).toFixed(1)}%;background:#2A78D6;border-radius:0 4px 4px 0"></span><span style="font-size:12px;color:var(--muted)">NT$ ${fmt(x.value)}</span></span>
     <span class="b" style="text-align:right;font-size:14px">${(x.value/c.value*100).toFixed(1)}%</span></div>`).join('')}</div>`:'<p class="foot">填入持股現價後才能計算比重。</p>'}</figure>
  </div>
  <figure><div class="fh"><figcaption>每月已實現損益</figcaption><span class="foot">已實現 ${signed(c.realized)}　未實現 ${signed(c.unreal)}</span></div>
   ${months.length?`<div class="scroll"><div class="months">${months.map(m=>{const v=c.monthly[m],h=Math.max(2,Math.abs(v)/maxM*100).toFixed(1)+'%';
    return `<div class="mcol" role="img" aria-label="${m} 已實現損益 ${signed(v)}"><span class="b" style="height:20px">${signed(v)}</span>
     <span class="h" style="align-items:flex-end"><span style="width:28px;height:${v>0?h:'0'};background:var(--up);border-radius:4px 4px 0 0"></span></span>
     <span style="height:1px;width:100%;background:#9CA3AF"></span>
     <span class="h" style="align-items:flex-start"><span style="width:28px;height:${v<0?h:'0'};background:var(--down);border-radius:0 0 4px 4px"></span></span>
     <span>${Number(m.slice(5))}月</span><span style="font-size:12px;color:var(--muted)">${m.slice(0,4)}</span></div>`}).join('')}</div></div>`:'<p class="foot">還沒有賣出紀錄，賣出後這裡會出現每月實現的損益。</p>'}
  </figure></div>`;
}

function render(){
  const c=compute(),t=ui.tab;
  document.getElementById('app').innerHTML=`
  ${!data.trades.length?`<div class="panel pad" style="background:#EFF6FF;border-color:#BFDBFE;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span>還沒有資料。如果你有備份檔，按「匯入備份」把紀錄放進來；或直接新增第一筆交易。</span><button type="button" class="btn" data-act="import">匯入備份</button></div>`:''}
  ${data.sample?`<div class="panel pad" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#FFFBEB;border-color:#FDE68A"><span>目前顯示的是範例資料。</span><button type="button" class="btn2" data-act="clearSample">清除範例，開始記我的帳</button></div>`:''}
  <div id="summary">${summaryHTML(c)}</div>
  <div class="row" style="align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-8px"><span id="quoteStatus" role="status"></span><button type="button" class="btn2" data-act="quotes" style="min-height:40px">立即更新現價</button></div>
  ${ui.edit?'':formHTML()}
  <section class="panel" aria-label="持股與交易">
   <div class="bar"><div class="tabs" role="tablist">
     <button type="button" role="tab" data-tab="holdings" aria-selected="${t==='holdings'}">目前持股</button>
     <button type="button" role="tab" data-tab="trades" aria-selected="${t==='trades'}">交易紀錄（${data.trades.length}）</button>
     <button type="button" role="tab" data-tab="analysis" aria-selected="${t==='analysis'}">損益分析</button></div>
    <div class="row" style="align-items:center">
     ${t==='trades'?['all','buy','sell'].map(f=>`<button type="button" class="pill" data-filter="${f}" aria-pressed="${ui.filter===f}">${{all:'全部',buy:'買進',sell:'賣出'}[f]}</button>`).join(''):''}
     ${t!=='analysis'?`<button type="button" class="switch" data-act="edit" aria-pressed="${ui.edit}"><span class="t" aria-hidden="true"><i></i></span>記帳模式</button>`:''}
    </div></div>
   ${ui.edit&&t!=='analysis'?`<div class="note"><span>記帳模式：直接在表格裡輸入或修改，會自動儲存。未填完的列不會計入。</span>${t==='trades'?'<button type="button" class="btn" data-act="addRow">＋ 新增一列</button>':''}</div>`:''}
   ${t==='holdings'?holdingsHTML(c):t==='trades'?tradesHTML():analysisHTML(c)}
  </section>
  <section class="panel pad"><h2 style="font-size:15px">資料備份</h2>
   <p class="foot" style="margin-bottom:10px">資料存在這台裝置的瀏覽器裡。換手機、清除瀏覽器資料前，請先匯出備份。</p>
   <div class="tools"><button type="button" class="btn2" data-act="export">匯出備份</button><button type="button" class="btn2" data-act="import">匯入備份</button><button type="button" class="btn2" data-act="wipe" style="color:#B91C1C">清空所有資料</button></div>
  </section>
  <p class="foot">賣出若有填「利潤」，已實現損益以你填的數字為準；沒填才用平均成本自動估算。手續費以 0.1425%（最低 NT$20）、證交稅以賣出 0.3% 估算；紅色為獲利、綠色為虧損（台股慣例）。現價自動取自臺灣證券交易所與櫃買中心公開資料（每日收盤價），手動輸入的現價會在下次更新時被覆蓋。</p>`;
}

const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-detail]');if(!b)return;
  if(b.dataset.detail){document.getElementById('pldetail').textContent=b.dataset.detail;return}
  if(b.dataset.tab){ui.tab=b.dataset.tab;if(ui.tab==='analysis')ui.edit=false;return render()}
  if(b.dataset.filter){ui.filter=b.dataset.filter;return render()}
  const a=b.dataset.act;
  if(a==='side'){ui.form.side=b.dataset.v;return render()}
  if(a==='edit'){ui.edit=!ui.edit;if(ui.edit&&ui.tab==='analysis')ui.tab='trades';return render()}
  if(a==='addRow'){data.trades.push({id:data.nextId++,date:today(),code:'',name:'',side:'buy',qty:'',price:''});ui.filter='all';data.sample=false;save();render();
    const first=app.querySelector('tr[data-row] input[data-e="code"]');if(first)first.focus();return}
  if(a==='del'){data.trades=data.trades.filter(t=>t.id!==Number(b.dataset.id));save();return render()}
  if(a==='add'){const f=ui.form;
    if(!f.date||!f.code||!(num(f.qty)>0)||!(num(f.price)>0)){ui.error='請填寫日期、代號、股數與成交價';return render()}
    const known=data.trades.find(t=>t.code===f.code);
    data.trades.push({id:data.nextId++,date:f.date,code:f.code.trim(),name:f.name||(known?known.name:f.code),side:f.side,qty:num(f.qty),price:num(f.price),broker:f.broker||''});
    ui.form=Object.assign({},f,{code:'',name:'',qty:'',price:''});ui.error='';ui.tab='trades';data.sample=false;save();return render()}
  if(a==='clearSample'){data={nextId:1,prices:{},trades:[]};save();return render()}
  if(a==='wipe'){if(confirm('確定要清空所有紀錄嗎？這個動作無法復原。')){data={nextId:1,prices:{},trades:[]};save();render()}return}
  if(a==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);
    const l=document.createElement('a');l.href=u;l.download='股票紀錄備份-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
  if(a==='import'){document.getElementById('importFile').click()}
});
app.addEventListener('mouseover',e=>{const r=e.target.closest('[data-detail]');if(r)document.getElementById('pldetail').textContent=r.dataset.detail});
app.addEventListener('focusin',e=>{const r=e.target.closest('[data-detail]');if(r)document.getElementById('pldetail').textContent=r.dataset.detail});
function liveUpdate(){document.getElementById('summary').innerHTML=summaryHTML(compute())}
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){ui.form[el.dataset.f]=el.value;ui.error='';const p=document.getElementById('preview');
    const f=ui.form,ok=num(f.qty)>0&&num(f.price)>0,b=f.side==='buy';
    if(p)p.innerHTML=`<span>預估金額 NT$ ${ok?fmt(num(f.qty)*num(f.price)):'—'}</span><span>手續費 NT$ ${ok?fmt(fee(num(f.qty),num(f.price))):'—'}</span><span>證交稅 NT$ ${ok?(b?'0':fmt(tax(num(f.qty),num(f.price),'sell'))):'—'}</span>`;return}
  if(el.dataset.e){const id=Number(el.closest('tr').dataset.row),t=data.trades.find(x=>x.id===id);if(!t)return;
    t[el.dataset.e]=el.value;data.sample=false;save();liveUpdate();
    const ok=valid(t),cell=el.closest('tr').querySelector('[data-net]');el.closest('tr').className=ok?'':'incomplete';
    if(cell){const q=num(t.qty),p=num(t.price),f=fee(q,p),x=tax(q,p,t.side);cell.textContent=ok?signed(t.side==='buy'?-(q*p+f):q*p-f-x):'未填完';cell.style.color=ok?'var(--ink)':'#6B7280'}
    if(el.dataset.e==='side')el.className=el.value;return}
  if(el.dataset.price!==undefined){data.prices[el.dataset.price]=el.value;save();liveUpdate()}
});
app.addEventListener('change',e=>{if(e.target.dataset.price!==undefined)render()});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.trades))throw 0;
    d.prices=d.prices||{};d.nextId=d.nextId||(Math.max(0,...d.trades.map(t=>t.id||0))+1);d.sample=false;data=d;save();render();alert('匯入完成')}
    catch(x){alert('這不是有效的備份檔')}e.target.value=''};
  r.readAsText(f);
});
// ---- 自動帶入每日收盤價（證交所＋櫃買中心公開資料）----
const QKEY='my-stock-quotes-v1';
let quote={status:'idle',date:'',fetchedAt:0,missing:[],taiex:null};
try{const q=JSON.parse(localStorage.getItem(QKEY));if(q)quote=Object.assign(quote,q,{status:'idle'})}catch(e){}
const toNum=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)&&n>0?n:null};
const rocDate=d=>{d=String(d||'').replace(/\D/g,'');if(d.length===7)return (Number(d.slice(0,3))+1911)+'-'+d.slice(3,5)+'-'+d.slice(5);if(d.length===8)return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);return ''};
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
function paintQuote(){
  const el=document.getElementById('quoteStatus');
  const tx=document.getElementById('taiex'),tc=document.getElementById('taiexChg');
  if(tx&&quote.taiex){tx.textContent=fmt(quote.taiex.close,2);const ch=quote.taiex.chg;
    if(tc){tc.textContent=ch==null?'':(ch>0?'▲ ':ch<0?'▼ ':'')+fmt(Math.abs(ch),2)+(quote.taiex.pct!=null?'（'+pct(quote.taiex.pct)+'）':'');tc.style.color=ch>0?'#FCA5A5':ch<0?'#86EFAC':'#CBD5E1'}}
  if(!el)return;
  const when=quote.fetchedAt?new Date(quote.fetchedAt).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  let msg;
  if(quote.status==='loading')msg='正在更新現價…';
  else if(quote.status==='error')msg='現價暫時無法自動取得，可以在記帳模式手動輸入。'+(when?'（上次更新 '+when+'）':'');
  else if(quote.fetchedAt)msg='現價為 '+(quote.date||'最近交易日')+' 收盤價，'+when+' 更新'+(quote.missing.length?'。查不到：'+quote.missing.join('、')+'，請手動輸入':'');
  else msg='現價尚未更新';
  el.textContent=msg;
}
async function refreshQuotes(){
  quote.status='loading';paintQuote();
  const codes=[...new Set(compute().holdings.map(h=>h.code))];
  const got={};let date='',ok=0;
  // 先讀網站自己的 prices.json（由 GitHub Actions 每天更新，不會被瀏覽器擋）
  try{const pj=await getJSON('./prices.json?t='+Date.now());
    if(pj&&pj.prices){ok++;date=pj.date||'';codes.forEach(c=>{const p=toNum(pj.prices[c]);if(p)got[c]=p});if(pj.taiex&&pj.taiex.close)quote.taiex=pj.taiex}}catch(e){}
  if(codes.some(c=>!got[c]))try{const tw=await getJSON('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');ok++;
    tw.forEach(r=>{const p=toNum(r.ClosingPrice);if(p&&codes.includes(String(r.Code).trim()))got[String(r.Code).trim()]=p;if(!date&&r.Date)date=rocDate(r.Date)})}catch(e){}
  if(codes.some(c=>!got[c])){
    try{const ot=await getJSON('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes');ok++;
      ot.forEach(r=>{const c=String(r.SecuritiesCompanyCode||r.Code||'').trim(),p=toNum(r.Close);if(p&&codes.includes(c)&&!got[c])got[c]=p;if(!date&&r.Date)date=rocDate(r.Date)})}catch(e){}
  }
  if(!quote.taiex||!date)try{const mi=await getJSON('https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX');
    const row=mi.find(r=>String(r['指數']||'').includes('發行量加權股價指數'));
    if(row){const sign=String(row['漲跌']||'').includes('-')?-1:1;const pts=toNum(row['漲跌點數']);
      quote.taiex={close:toNum(row['收盤指數']),chg:pts==null?0:sign*pts,pct:row['漲跌百分比']!=null&&row['漲跌百分比']!==''?parseFloat(row['漲跌百分比']):null};
      if(!date&&row['日期'])date=rocDate(row['日期'])}}catch(e){}
  if(!ok){quote.status='error';paintQuote();return}
  Object.keys(got).forEach(c=>{data.prices[c]=got[c]});save();
  quote=Object.assign(quote,{status:'ok',date,fetchedAt:Date.now(),missing:codes.filter(c=>!got[c])});
  try{localStorage.setItem(QKEY,JSON.stringify(quote))}catch(e){}
  render();
}
const _render=render;render=function(){_render();paintQuote()};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act="quotes"]');if(b)refreshQuotes()});
render();
if(!quote.fetchedAt||Date.now()-quote.fetchedAt>30*60*1000)refreshQuotes();
setInterval(refreshQuotes,30*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-quote.fetchedAt>30*60*1000)refreshQuotes()});
})();
</script>
